<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NW Badges</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>NW Badges</h1>
      <div class="muted">Small celebration board — tap an initial to learn more.</div>
    </div>

    <div class="controls">
      <button id="theme-toggle">Toggle theme</button>
      <button id="suggest-btn">Suggest badge</button>
    </div>
  </header>

  <main class="layout">
    <section class="left-col">
      <div id="selected-container" class="panel hide" aria-hidden="true">
        ...
      </div>

      <div id="float-stage" class="float-stage panel" aria-live="polite"></div>
    </section>

    <aside class="right-col">
      <div class="panel">
        <strong>Recent activity</strong>
        <div id="recent-list" class="muted" style="margin-top:10px">Loading…</div>
      </div>

      <div class="panel" style="margin-top:12px">
        <strong>About this view</strong>
        <div id="about-view" class="muted" style="margin-top:8px;line-height:1.5">
          <!-- new copy -->
          - Tap an initial to check out a team member's badges<br>
          - Scroll through the All badges panel below to see the full list
        </div>
      </div>

      <div class="panel" style="margin-top:12px">
        <strong>All badges</strong>
        <div id="all-badges" class="hrow" style="padding-top:12px"></div>
      </div>
    </aside>
  </main>

  <!-- Suggest modal (stub) -->
  <div id="suggest-modal" class="overlay hide">
    ...
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
